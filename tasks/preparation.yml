---
- name: Create freshrss_root_dir if it doesn't exist
  ansible.builtin.file:
    path: "{{ freshrss_root_dir }}"
    state: directory
    mode: "0755"

- name: Install cron for automatic feed refresh
  ansible.builtin.apt:
    name: cron
    state: present
    update_cache: true

- name: Install php dependencies
  ansible.builtin.apt:
    pkg:
      - php
      - php-curl
      - php-gmp
      - php-intl
      - php-mbstring
      - php-sqlite3
      - php-xml
      - php-zip
    state: present
    update_cache: true
