---
- name: Install cron for automatic feed refresh
  ansible.builtin.apt:
    name: cron
    state: present
    update_cache: true

- name: Install php dependencies
  ansible.builtin.apt:
    pkg:
      - php
      - php-curl
      - php-gmp
      - php-intl
      - php-mbstring
      - php-sqlite3
      - php-xml
      - php-zip
    state: present
    update_cache: true
